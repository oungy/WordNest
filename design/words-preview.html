const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function home(){return `<section class="page"><div class="inner"><div class="eyebrow">WEDNESDAY · 11 / 04</div><div class="hero"><h1>把新词，<br>读进生活。</h1><p>大学英语六级 · 今天也积累一点</p></div><div class="stats"><div><div class="small muted">今日新学</div><div class="number">${state.learned.length}<small> / 3</small></div></div><div><div class="small muted">待复习</div><div class="number">${3-state.reviewed.length}<small> 词</small></div></div></div><div class="stack" style="margin-top:25px">${button(state.learned.length===3?'查看今日成果':state.learned.length?'继续学习':'开始学习','start')}${button(state.reviewed.length===3?'再巩固一遍':'先复习旧词','review','secondary')}</div><button type="button" class="section-link cursor-interaction" data-action="nav:reading"><span><span class="small muted">让词汇回到语境</span><h3>今日阅读</h3><span class="small muted">一座城市花园，三个熟悉的词。</span></span>${icon('arrow-up-right')}</button></div>${nav('home')}</section>`;}

ata')}</h2><button class="setting-link cursor-interaction" data-action="nav:api"><span>DeepSeek API</span><span class="muted small">${t('未接入','Not connected')} →</span></button><button class="setting-link cursor-interaction" data-action="backup-info"><span>${t('备份与恢复','Backup & restore')}</span>${icon('chevron-right')}</button><button class="setting-link cursor-interaction" data-action="nav:about"><span>${t('版本与关于','Version & about')}</span>${icon('chevron-right')}</button></div><p class="library-note">${t('预览设置只在本次交互中有效。','Preview settings last for this interaction only.')}</p><p id="wp-feedback" role="status"></p></div>${nav('')}</section>`;}

function applyAppearance(){root.style.colorScheme=state.theme==='system'?'light dark':state.theme;root.dataset.palette=state.palette;root.dataset.highlight=state.highlight?'on':'off';root.dataset.transparency=state.reduceTransparency?'reduced':'standard';root.style.setProperty('--wp-reading',state.fontSize+'px');root.style.setProperty('--wp-atmosphere',state.atmosphere?1:0);}
function hydrateControls(container){
  container.querySelectorAll('select').forEach((selectEl,index)=>{
    const key=selectEl.dataset.setting||(selectEl.id==='wp-context'?'context':'model');
    const label=selectEl.getAttribute('aria-label')||selectEl.closest('label')?.querySelector('span')?.textContent||t('选择','Choose');
    const choices=[...selectEl.options].map((o,i)=>({value:key==='context'?['free','today','notebook'][i]:o.value,label:o.textContent,disabled:o.disabled}));
    if(key==='context'){
      const detail=[t('只发送你的对话，不附加单词。','Send your conversation without vocabulary.'),t('附加今天学习过的词，方便复习。','Include today’s words for review.'),t('附加所选词本：','Use selected notebook: ')+(currentBook()?.name||state.notebooks[0]?.name||t('暂无词本','No notebook'))];
      choices.forEach((c,i)=>{c.detail=detail[i];c.icon=['message-circle','sun','book-open'][i];if(i===2&&!state.notebooks.length)c.disabled=true;});
    }
    let value=state[key]===undefined?choices[selectEl.selectedIndex]?.value:String(state[key]);
    if(!choices.some(c=>c.value===value&&!c.disabled))value=choices.find(c=>!c.disabled)?.value||choices[0]?.value;
    if(key==='context')state.context=value;
    const cfg={key,label,choices,value,disabled:selectEl.disabled};pickerConfigs.set(key,cfg);
    const trigger=document.createElement('button');trigger.type='button';trigger.className='choice-trigger cursor-interaction';trigger.dataset.picker=key;trigger.disabled=cfg.disabled;
    trigger.setAttribute('aria-label',label);trigger.setAttribute('aria-haspopup','menu');trigger.setAttribute('aria-expanded','false');trigger.setAttribute('aria-controls','wp-choice-menu');
    const textId='wp-choice-'+key;trigger.setAttribute('aria-describedby',textId);
    trigger.innerHTML=`<span id="${textId}">${esc(choices.find(c=>c.value===value)?.label||'')}</span>${icon(cfg.disabled?'lock-keyhole':'chevron-down')}`;
    selectEl.replaceWith(trigger);
  });
  container.querySelectorAll('input[type=checkbox][data-setting]').forEach(el=>el.setAttribute('role','switch'));
}
function closePicker(restore=true){
  picker.hidden=true;picker.innerHTML='';screen.inert=false;
  if(pickerTrigger?.isConnected){pickerTrigger.setAttribute('aria-expanded','false');if(restore)pickerTrigger.focus({preventScroll:true});}
  pickerTrigger=null;activePicker=null;
}
function openPicker(trigger){
  const cfg=pickerConfigs.get(trigger.dataset.picker);if(!cfg||cfg.disabled)return;
  if(pickerTrigger===trigger&&!picker.hidden){closePicker();return;}
  closePicker(false);pickerTrigger=trigger;activePicker=cfg;
  trigger.setAttribute('aria-expanded','true');picker.hidden=false;
  picker.innerHTML=`<div class="picker-panel"><div class="picker-title" id="wp-choice-title">${esc(cfg.label)}</div><div id="wp-choice-menu" role="menu" aria-labelledby="wp-choice-title">${cfg.choices.map(c=>`<button type="button" class="picker-option cursor-interaction" role="menuitemradio" aria-checked="${c.value===cfg.value}" data-picker-value="${esc(c.value)}" ${c.disabled?'disabled':''}>${c.icon?`<span class="option-icon">${icon(c.icon)}</span>`:''}<span class="option-copy"><span class="option-label">${esc(c.label)}</span>${c.detail?`<span class="option-detail">${esc(c.detail)}</span>`:''}</span>${c.value===cfg.value?icon('check'):'<span class="check-space" aria-hidden="true"></span>'}</button>`).join('')}</div></div>`;
  const phone=root.querySelector('.words-phone');const panel=picker.firstElementChild;const pr=phone.getBoundingClientRect();const tr=trigger.getBoundingClientRect();
  const width=Math.min(Math.max(tr.width,260),phone.clientWidth-24);panel.style.width=width+'px';
  panel.style.left=Math.max(12,Math.min(tr.left-pr.left,phone.clientWidth-width-12))+'px';
  const height=panel.offsetHeight;const below=tr.bottom-pr.top+8;const visibleBottom=Math.min(phone.clientHeight,window.innerHeight-pr.top);
  const above=tr.top-pr.top-height-8;const top=below+height<=visibleBottom-12?below:(above>=12?above:Math.max(12,Math.min(below,phone.clientHeight-height-12)));
  panel.style.top=top+'px';panel.style.transformOrigin=top< tr.top-pr.top?'50% 100%':'50% 0';
  if(globalThis.lucide)lucide.createIcons();screen.inert=true;
  (picker.querySelector('[aria-checked=true]:not(:disabled)')||picker.querySelector('button:not(:disabled)')).focus({preventScroll:true});
}
function choosePicker(value){
  const cfg=activePicker;if(!cfg)return;const choice=cfg.choices.find(c=>c.value===value&&!c.disabled);if(!choice)return;
  const trigger=pickerTrigger;state[cfg.key]=value;cfg.value=value;closePicker(false);applyAppearance();
  if(cfg.key==='language'){render();screen.querySelector('[data-picker="language"]')?.focus({preventScroll:true});}
  else {trigger.querySelector('span').textContent=choice.label;trigger.focus({preventScroll:true});}
}
function reading(){return `<section class="page"><div class="inner"><div class="eyebrow">WORDS IN CONTEXT</div><div class="row" style="margin-top:13px"><h1>今日阅读</h1>${button(icon('message-circle'),'reading-help','icon-button')}</div><p class="muted small" style="margin-top:10px">示例节选 · 3 个目标词 · 点击查词</p><div class="reading-title">A Garden That<br>Changed a Neighborhood</div><div class="reading"><p>When residents turned an abandoned parking lot into a garden, few expected it to change the neighborhood. The benefits were <button class="target-word cursor-interaction" data-action="definition:1">subtle</button> at first: people stopped to talk, exchanged seeds, and began to recognize one another.</p><p>Then a summer storm damaged much of what they had planted. Instead of giving up, they rebuilt together. The garden had helped create a more <button class="target-word cursor-interaction" data-action="definition:0">resilient</button> community—one that could respond to setbacks rather than simply endure them.</p><p>To <button class="target-word cursor-interaction" data-action="definition:2">sustain</button> this progress, the residents shared responsibility for watering and repairs. What mattered was not a single ambitious plan, but the ordinary work people were willing to repeat.</p></div>${button(state.translation?'收起中文翻译':'展开中文翻译','translate','text-button')}${state.translation?`<div class="reading-cn">居民们把废弃停车场改造成花园时，很少有人想到它会改变整个街区。起初，益处很细微：大家停下脚步聊天、交换种子，也渐渐熟悉了彼此。<br><br>一场夏日暴风雨毁坏了许多植物，但居民没有放弃，而是一起重建。这座花园让社区更有韧性，能够主动应对挫折。为了让这种进步持续，大家共同承担浇水和修缮的责任。关键在于人们愿意持续做下去的日常小事。</div>`:''}</div>${nav('reading')}</section>`;}
function render(){closePicker(false);pickerConfigs.clear();applyAppearance();screen.innerHTML=({home,learn,complete,books,reading,notebook,smart,settings,api,chat,catalog,about}[state.page]||home)();if(state.page==='home'){const top=screen.querySelector('.eyebrow');top.outerHTML=`<div class="row">${top.outerHTML}<button class="icon-button cursor-interaction" data-action="nav:settings" aria-label="${t('设置','Settings')}">${icon('settings-2')}</button></div>`;}if(state.page==='settings'){const appearance=screen.querySelector('.settings-section');appearance.insertAdjacentHTML('beforeend',`<label class="check-row"><span>${t('减少透明效果','Reduce transparency')}</span><input type="checkbox" data-setting="reduceTransparency" ${state.reduceTransparency?'checked':''}></label>`);}screen.querySelectorAll('.icon-button').forEach(b=>{if(!b.hasAttribute('aria-label'))b.setAttribute('aria-label',b.dataset.action==='reading-help'?'询问 AI 阅读讲解':'返回今日');});hydrateControls(screen);if(globalThis.lucide)lucide.createIcons();}
function closeSheet(){dialog.hidden=true;dialog.innerHTML='';if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});else screen.querySelector('button')?.focus({preventScroll:true});}
function sheet(title,content){const opening=dialog.hidden;if(opening)returnFocus=document.activeElement;dialog.hidden=false;dialog.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="wp-sheet-title"><div class="row"><h2 id="wp-sheet-title">${title}</h2><button type="button" data-action="close" class="icon-button cursor-interaction" aria-label="关闭">${icon('x')}</button></div>${content}</section>`;if(opening){const phone=root.querySelector('.words-phone');const offset=state.page==='reading'?Math.max(0,Math.min(returnFocus.getBoundingClientRect().top-phone.getBoundingClientRect().top-80,phone.clientHeight-dialog.firstElementChild.offsetHeight)):0;dialog.style.alignItems=state.page==='reading'?'flex-start':'flex-end';dialog.style.paddingTop=offset+'px';}if(globalThis.lucide)lucide.createIcons();dialog.querySelector('button').focus({preventScroll:true});}
function wordSheet(i){const w=words[i];sheet(w.word,`<p class="muted small">${w.ipa}</p><p>${w.meaning}</p><p class="small muted">${w.example}</p>${button(state.saved.includes(i)?t('已在生词分类 · 点击移除','Saved · Remove'):t('加入生词分类','Save word'),'sheet-save:'+i)}<div style="margin-top:10px">${button(t('加入自定义词本','Add to notebooks'),'pick-books:'+i,'secondary')}</div>${button(t('查看 AI 讲解示例','View sample explanation'),'explain:'+i,'text-button')}`);}
root.addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(form.id==='wp-book-form'){const rename=form.dataset.rename==='true';const name=form.elements.name.value.trim().normalize('NFKC');const duplicate=state.notebooks.some(b=>b.name.toLocaleLowerCase()===name.toLocaleLowerCase()&&(!rename||b.id!==state.bookId));if(!name||name.length>32||duplicate){dialog.querySelector('#wp-book-error').textContent=duplicate?t('这个名称已存在，请换一个。','That name already exists.'):t('请输入 1–32 个字符。','Enter 1–32 characters.');return;}if(rename)currentBook().name=name;else{const id=state.nextBookId++;state.notebooks.push({id,name,words:[]});state.bookId=id;}state.page='notebook';closeSheet();render();}else if(form.id==='wp-words-form'){const ids=[...form.querySelectorAll('input:checked')].map(x=>Number(x.value));currentBook().words=[...new Set([...currentBook().words,...ids])];closeSheet();render();}else if(form.id==='wp-membership-form'){const word=Number(form.dataset.word);const ids=[...form.querySelectorAll('input:checked')].map(x=>Number(x.value));state.notebooks.forEach(b=>{b.words=ids.includes(b.id)?[...new Set([...b.words,word])]:b.words.filter(i=>i!==word);});closeSheet();render();}});
root.addEventListener('click',e=>{const save=e.target.closest('[data-form-save]');if(save)save.closest('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('form input')){e.preventDefault();e.target.closest('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));}});
root.addEventListener('input',e=>{if(e.target.dataset.setting==='fontSize'){state.fontSize=Number(e.target.value);applyAppearance();const o=root.querySelector('#wp-size');if(o)o.textContent=state.fontSize;}});
root.addEventListener('change',e=>{const key=e.target.dataset.setting;if(!key)return;if(key==='dailyGoal'){const n=Number(e.target.value);if(!Number.isInteger(n)||n<1||n>200){e.target.value=state.dailyGoal;const o=root.querySelector('#wp-feedback');if(o)o.textContent=t('每日目标为 1–200 个词。','Choose a daily goal from 1 to 200.');return;}state.dailyGoal=n;}else state[key]=e.target.type==='checkbox'?e.target.checked:e.target.type==='range'?Number(e.target.value):e.target.value;applyAppearance();if(key==='language'){closeSheet();render();}});
root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const [a,v]=el.dataset.action.split(':');const i=Number(v);let handled=true;switch(a){case'new-book':bookForm();break;case'book':state.bookId=i;state.page='notebook';render();break;case'smart':state.smart=v;state.page='smart';render();break;case'manage-book':sheet(t('管理词本','Manage notebook'),`<p>${esc(currentBook().name)}</p>${button(t('重命名','Rename'),'rename-book','secondary')}${button(t('删除这个词本','Delete this notebook'),'delete-book','text-button danger')}`);break;case'rename-book':bookForm(true);break;case'delete-book':sheet(t('删除这个词本？','Delete this notebook?'),`<p>${esc(currentBook().name)}</p><p class="muted">${t('只删除词本及其归属关系。单词、其他词本和学习历史都会保留。','Only this notebook and its memberships are deleted. Words, other notebooks and learning history remain.')}</p>${button(t('确认删除词本','Confirm deletion'),'confirm-delete')}${button(t('取消','Cancel'),'close','text-button')}`);break;case'confirm-delete':state.notebooks=state.notebooks.filter(b=>b.id!==state.bookId);state.page='books';closeSheet();render();break;case'add-words':addWords();break;case'remove-word':currentBook().words=currentBook().words.filter(n=>n!==i);render();break;case'pick-books':pickBooks(i);break;case'catalog-filter':state.catalog=v;render();break;case'catalog-info':{const b=catalogs.find(x=>x.id===v);sheet(t(b.name,b.english),`<p>${t(b.basis,b.basisEn)}</p><p class="muted">${t('状态：规划中，未内置。发布前核对词表版本、释义与例句来源，以及可分发范围。','Status: planned, not bundled. Verify vocabulary edition, definition sources and redistribution terms before release.')}</p><p class="small muted">${t('词书版本与 App 版本分别管理；换书不重置已学记录。','Wordbook versions are separate from app versions. Switching books keeps learning history.')}</p>`);break;}case'api-info':sheet(t('真实连接测试','Live connection test'),`<p>${t('此预览不发送请求，也不接收真实 Key。','This preview sends no requests and accepts no real API key.')}</p><p class="muted">${t('原生版将先获取可用模型，再由你发起一次简短对话，验证鉴权、响应和错误处理。聊天可能产生 API 费用。','The native app will load models, then test a short conversation when requested. Chat calls may incur API charges.')}</p>`);break;case'backup-info':sheet(t('备份与恢复','Backup & restore'),`<p>${t('原生版将支持导出词本、学习历史、文章和设置，并预览恢复内容。','The native app will export notebooks, history, articles and settings, and preview restore contents.')}</p><p class="muted">${t('API Key 不进入普通备份。当前预览没有创建或导入备份文件。','API keys are excluded. This preview has not created or imported any backup.')}</p>`);break;default:handled=false;}if(handled)e.stopImmediatePropagation();});
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const [a,v]=b.dataset.action.split(':');const i=Number(v);switch(a){case'nav':state.page=v;break;case'start':state.session='learn';if(state.learned.length===3){state.page='complete';}else{state.index=words.findIndex((_,n)=>!state.learned.includes(n));state.revealed=false;state.page='learn';}break;case'review':state.session='review';state.index=state.reviewed.length===3?0:words.findIndex((_,n)=>!state.reviewed.includes(n));state.revealed=false;state.page='learn';break;case'reveal':state.revealed=true;break;case'rate':{const list=state.session==='review'?state.reviewed:state.learned;if(!list.includes(state.index))list.push(state.index);if(i<2&&!state.mistakes.includes(state.index))state.mistakes.push(state.index);if(state.index===2){state.page='complete';}else{state.index++;state.revealed=false;}break;}case'save':state.saved=state.saved.includes(i)?state.saved.filter(n=>n!==i):[...state.saved,i];break;case'sheet-save':state.saved=state.saved.includes(i)?state.saved.filter(n=>n!==i):[...state.saved,i];render();wordSheet(i);return;case'filter':state.filter=v;break;case'translate':state.translation=!state.translation;break;case'definition':wordSheet(i);return;case'explain':sheet('记住这个词',`<p class="small muted">AI 讲解示例 · 未连接 API</p><p class="sheet-word">${words[i].word}</p><p>${words[i].explain}</p>`);return;case'reading-help':sheet('读懂这段话',`<p class="small muted">AI 讲解示例 · 未连接 API</p><p>这段文字通过社区花园的故事，把三个词串在一起：</p><p><strong>subtle</strong>：最初细微的变化。<br><strong>resilient</strong>：受挫后恢复的能力。<br><strong>sustain</strong>：让好的变化持续。</p><p class="small muted">真实版本中可以继续追问句意、语法和用词。</p>`);return;case'close':closeSheet();return;}render();});
dialog.addEventListener('click',e=>{if(e.target===dialog)closeSheet();});
dialog.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();return;}if(e.key==='Tab'){const bs=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')];if(e.shiftKey&&document.activeElement===bs[0]){e.preventDefault();bs.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===bs.at(-1)){e.preventDefault();bs[0].focus();}}});
root.addEventListener('click',e=>{const trigger=e.target.closest('[data-picker]');if(trigger){openPicker(trigger);return;}const choice=e.target.closest('[data-picker-value]');if(choice){choosePicker(choice.dataset.pickerValue);return;}if(e.target===picker)closePicker();});
root.addEventListener('keydown',e=>{const trigger=e.target.closest('[data-picker]');if(trigger&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();openPicker(trigger);}});
picker.addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();closePicker();return;}
  if(e.key==='Tab'){closePicker();return;}
  if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
    e.preventDefault();const items=[...picker.querySelectorAll('[role=menuitemradio]:not(:disabled)')];const index=items.indexOf(document.activeElement);
    const next=e.key==='Home'?0:e.key==='End'?items.length-1:(index+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items[next]?.focus({preventScroll:true});
  }
});
window.addEventListener('resize',()=>closePicker(false));
render();
})();
</script>
